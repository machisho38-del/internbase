name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate JavaScript syntax
        run: |
          node --check public/static/admin.js
          node --check public/static/public.js
          node --check e2e/preview.spec.mjs
          node --check playwright.config.mjs

      - name: Verify admin content actions
        run: npm run check:admin-actions

      - name: Verify Pages headers are included
        run: |
          test -f dist/_headers
          grep -Fq '/static/admin.js' dist/_headers
          grep -Fq '/static/public.js' dist/_headers
