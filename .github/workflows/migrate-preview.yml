name: Migrate preview D1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-preview-d1
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to internship-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_D1_ID: ${{ vars.CLOUDFLARE_PREVIEW_D1_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_PREVIEW_D1_ID" || { echo "CLOUDFLARE_PREVIEW_D1_ID is not configured"; exit 1; }

      - name: Create preview Wrangler configuration
        env:
          CLOUDFLARE_PREVIEW_D1_ID: ${{ vars.CLOUDFLARE_PREVIEW_D1_ID }}
        run: |
          cat > "$GITHUB_WORKSPACE/.wrangler-preview-ci.jsonc" <<EOF
          {
            "name": "internship-site-preview-migrations",
            "compatibility_date": "2026-04-08",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "internship-preview",
                "database_id": "$CLOUDFLARE_PREVIEW_D1_ID"
              }
            ]
          }
          EOF

      - name: Apply preview migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply DB --remote
          --config "$GITHUB_WORKSPACE/.wrangler-preview-ci.jsonc"

      - name: Verify migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 execute DB --remote
          --config "$GITHUB_WORKSPACE/.wrangler-preview-ci.jsonc"
          --command "SELECT COUNT(*) AS applied_migrations FROM d1_migrations;"
