name: Preview E2E

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Cloudflare Pages Branch Preview URL (https://...internship-site.pages.dev)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-e2e-${{ inputs.preview_url }}
  cancel-in-progress: true

jobs:
  test:
    name: Test public and admin Preview pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_BASE_URL: ${{ inputs.preview_url }}
      PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL }}
      PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}

    steps:
      - name: Validate Preview URL
        shell: bash
        run: |
          node - <<'NODE'
          const url = new URL(process.env.PREVIEW_BASE_URL)
          const productionHost = 'internship-site.pages.dev'
          if (url.protocol !== 'https:' || !url.hostname.endsWith(`.${productionHost}`) || url.hostname === productionHost) {
            throw new Error(`Only Branch Preview URLs under *.${productionHost} are allowed`)
          }
          console.log(`Testing ${url.origin}`)
          NODE

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      # Keep Playwright outside package-lock so normal production installs stay small.
      - name: Install Playwright test runner
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Preview E2E tests
        id: playwright
        shell: bash
        run: |
          set +e
          npx playwright test --config=playwright.config.mjs 2>&1 | tee playwright-output.log
          test_status=${PIPESTATUS[0]}

          {
            echo "## Preview E2E result"
            echo
            if [ "$test_status" -eq 0 ]; then
              echo "✅ All enabled Preview E2E tests passed."
            else
              echo "❌ Preview E2E failed with exit code $test_status."
              echo
              echo "The final part of the Playwright output is included below. Download \`preview-e2e-report\` for screenshots, videos, and traces."
              echo
              echo '```text'
              tail -n 160 playwright-output.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-e2e-report
          path: |
            playwright-report/
            test-results/
            playwright-output.log
          if-no-files-found: ignore
          retention-days: 7
