name: Migrate production D1

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY-PRODUCTION-MIGRATIONS after saving a D1 bookmark
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-production-d1
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to internship-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Validate production safeguards
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production migrations may only run from main (got $GITHUB_REF)."
            exit 1
          }
          test "$CONFIRMATION" = "APPLY-PRODUCTION-MIGRATIONS" || {
            echo "Confirmation did not match APPLY-PRODUCTION-MIGRATIONS."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials and database configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$CLOUDFLARE_PRODUCTION_D1_ID" || { echo "CLOUDFLARE_PRODUCTION_D1_ID is not configured"; exit 1; }

      - name: Create production Wrangler configuration
        env:
          CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
        run: |
          cat > "$RUNNER_TEMP/wrangler-production-ci.jsonc" <<EOF
          {
            "name": "internship-site-production-migrations",
            "compatibility_date": "2026-04-08",
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "internship-production",
                "database_id": "$CLOUDFLARE_PRODUCTION_D1_ID"
              }
            ]
          }
          EOF

      - name: Show pending production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations list DB --remote
          --config "$RUNNER_TEMP/wrangler-production-ci.jsonc"

      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 migrations apply DB --remote
          --config "$RUNNER_TEMP/wrangler-production-ci.jsonc"

      - name: Verify migrations and Coming Soon mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations list DB --remote \
            --config "$RUNNER_TEMP/wrangler-production-ci.jsonc"
          npx wrangler d1 execute DB --remote --json \
            --config "$RUNNER_TEMP/wrangler-production-ci.jsonc" \
            --command "SELECT setting_value FROM site_settings WHERE setting_key = 'site_mode';" \
            > "$RUNNER_TEMP/site-mode.json"
          SITE_MODE=$(node -e '
            const value = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))
              .flatMap(result => result.results || [])
              .find(row => Object.hasOwn(row, "setting_value"))?.setting_value
            if (!value) process.exit(2)
            process.stdout.write(String(value))
          ' "$RUNNER_TEMP/site-mode.json")
          test "$SITE_MODE" = "coming_soon" || {
            echo "Expected Production site_mode=coming_soon, got: $SITE_MODE"
            exit 1
          }
          echo "Production migrations are current and site_mode remains coming_soon." >> "$GITHUB_STEP_SUMMARY"
